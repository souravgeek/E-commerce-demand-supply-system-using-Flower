[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomfl"
version = "1.0.0"
description = "Federated demand forecasting and inventory replenishment for multi-store e-commerce, built with Flower and PyTorch"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.22.0",
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["ecomfl"]

[tool.flwr.app]
publisher = "your-github-username"

[tool.flwr.app.components]
serverapp = "ecomfl.server_app:app"
clientapp = "ecomfl.client_app:app"

# Defaults, override with: flwr run . --run-config "num-server-rounds=20 proximal-mu=0.1"
[tool.flwr.app.config]
num-server-rounds = 15
fraction-train = 1.0
fraction-evaluate = 1.0
learning-rate = 0.01
local-epochs = 2
batch-size = 64
proximal-mu = 0.0          # 0.0 -> FedAvg, > 0 -> FedProx
num-stores = 6             # must equal num-supernodes below (used for the server-side pooled benchmark)
heterogeneity = 0.7        # 0 = IID stores, 1 = very different stores
data-seed = 42
run-tag = "fedavg"
save-model = true


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-simulation"

# [tool.flwr.federations.local-simulation]
# options.num-supernodes = 6
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
